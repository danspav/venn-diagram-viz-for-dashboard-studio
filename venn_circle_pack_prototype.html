<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Packed-Circle Venn — Prototype</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/venn.js/0.2.20/venn.min.js"></script>
<style>
  :root{
    --bg: #0d1117;
    --panel: #121820;
    --line: #263140;
    --text: #d5dde5;
    --muted: #7c8a99;
    --accent: #5fb3d9;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --sans: "Inter", -apple-system, "Segoe UI", sans-serif;
    --a: #5fb3d9;
    --b: #d9a441;
    --c: #d9564f;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding: 28px 32px 40px;
  }
  header{
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
  }
  h1{ font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub{ color: var(--muted); font-size: 13px; margin: 0; }
  .layout{ display:flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  #venn{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px;
    flex: 0 0 460px;
  }
  .venntooltip {
    position: absolute;
    text-align: left;
    padding: 6px 10px;
    font-family: var(--mono);
    font-size: 11.5px;
    background: #1a222d;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 5px;
    pointer-events: none;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    z-index: 10;
  }
  .venn-circle path{ stroke-width: 1.5px; fill-opacity: 0.06 !important; stroke-opacity: 0.55; }
  .venn-circle text{ fill: var(--muted) !important; font-family: var(--sans) !important; font-size: 12px !important; font-weight: 500; }
  .host-dot{ cursor: pointer; stroke: rgba(0,0,0,0.25); stroke-width: 0.5px; }
  .host-dot:hover{ stroke: var(--text); stroke-width: 1.5px; }

  /* Legend — direction-agnostic so it can be repositioned (top/bottom/left/right) later */
  .viz-wrap{ display:flex; align-items:center; justify-content:center; }
  .viz-wrap.legend-bottom{ flex-direction:column; }
  .viz-wrap.legend-top{ flex-direction:column-reverse; }
  .viz-wrap.legend-left{ flex-direction:row-reverse; }
  .viz-wrap.legend-right{ flex-direction:row; }
  .legend{ display:flex; gap: 22px; }
  .viz-wrap.legend-bottom .legend{ flex-direction:row; flex-wrap:wrap; justify-content:center; margin-top: 14px; }
  .viz-wrap.legend-top .legend{ flex-direction:row; flex-wrap:wrap; justify-content:center; margin-bottom: 14px; }
  .viz-wrap.legend-left .legend, .viz-wrap.legend-right .legend{ flex-direction:column; margin: 0 16px; }
  .legend-item{ display:flex; align-items:center; gap: 7px; font-size: 12.5px; color: var(--text); }
  .legend-item .dot{ width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; }
</style>
</head>
<body>

<header>
  <h1>Security Event Overlap — packed view</h1>
  <p class="sub">each dot is one host, packed inside its region — size = alert volume for that host</p>
</header>

<div class="viz-wrap legend-bottom">
  <div id="venn"></div>
  <div class="legend">
    <div class="legend-item"><span class="dot" style="background:var(--a)"></span>Failed logins</div>
    <div class="legend-item"><span class="dot" style="background:var(--b)"></span>Malware alerts</div>
    <div class="legend-item"><span class="dot" style="background:var(--c)"></span>Firewall blocks</div>
  </div>
</div>

<script>
// ---- Category colors --------------------------------------------------
const NAMES = { A: 'Failed logins', B: 'Malware alerts', C: 'Firewall blocks' };
const COLORS = { A: '#5fb3d9', B: '#d9a441', C: '#d9564f' };

function blend(keys){
  const rgbs = keys.map(k => d3.rgb(COLORS[k]));
  const r = d3.mean(rgbs, d=>d.r), g = d3.mean(rgbs, d=>d.g), b = d3.mean(rgbs, d=>d.b);
  return d3.rgb(r,g,b).formatHex();
}

// ---- Synthetic host data (scaled down for a legible prototype) --------
// Exclusive region counts, as you'd derive from:
//   | eval in_A=... in_B=... in_C=...
//   | stats max(in_A) as in_A max(in_B) as in_B max(in_C) as in_C count as alerts by host
const regionCounts = {
  'A':     34,
  'B':     21,
  'C':     28,
  'A,B':   10,
  'A,C':   13,
  'B,C':    6,
  'A,B,C':  4
};

let hostIdx = 0;
const hosts = [];
Object.entries(regionCounts).forEach(([regionKey, count]) => {
  const memberships = regionKey.split(',');
  for (let i=0; i<count; i++){
    hostIdx++;
    hosts.push({
      id: 'host-' + String(hostIdx).padStart(3,'0'),
      memberships,
      alerts: 3 + Math.round(Math.random()*17),
      color: memberships.length === 3 ? blend(['A','B','C']) : blend(memberships)
    });
  }
});

// venn.js needs cumulative single-set sizes (all members, including overlaps)
function totalFor(key){
  return Object.entries(regionCounts)
    .filter(([k]) => k.split(',').includes(key))
    .reduce((sum,[,v]) => sum+v, 0);
}
const vennSets = [
  { sets: [NAMES.A], size: totalFor('A') },
  { sets: [NAMES.B], size: totalFor('B') },
  { sets: [NAMES.C], size: totalFor('C') },
  { sets: [NAMES.A, NAMES.B], size: regionCounts['A,B'] },
  { sets: [NAMES.A, NAMES.C], size: regionCounts['A,C'] },
  { sets: [NAMES.B, NAMES.C], size: regionCounts['B,C'] },
  { sets: [NAMES.A, NAMES.B, NAMES.C], size: regionCounts['A,B,C'] }
];

const chart = venn.VennDiagram().width(420).height(360);
const div = d3.select('#venn').datum(vennSets).call(chart);

// Style the base circles as faint outlines only (they're now a backdrop, not the data)
div.selectAll('.venn-circle path').style('fill', 'none').style('stroke', function(d){
  const key = d.sets[0];
  return key === NAMES.A ? COLORS.A : key === NAMES.B ? COLORS.B : COLORS.C;
});

// venn.js computes final circle geometry as a PRIVATE variable inside its
// own chart() closure — it's never attached to the datum, so `d.circle` is
// undefined. Its actual internal pipeline is:
//   venn.venn() -> venn.normalizeSolution() -> venn.scaleSolution()
// An earlier version of this file skipped normalizeSolution (which
// reorients the whole layout — by default rotating to a fixed orientation),
// so the geometry computed here didn't match what was actually drawn,
// even though sizes were right. All three steps are required, with the
// same defaults VennDiagram() uses (normalize: true, orientation: Math.PI/2).
let rawSolution = venn.venn(vennSets);
rawSolution = venn.normalizeSolution(rawSolution, Math.PI/2, null);
const scaled = venn.scaleSolution(rawSolution, 420, 360, 15);
const circles = { A: scaled[NAMES.A], B: scaled[NAMES.B], C: scaled[NAMES.C] };

// ---- Size mini-circles by alert volume ---------------------------------
const rScale = d3.scaleSqrt().domain(d3.extent(hosts, d=>d.alerts)).range([2.2, 5.5]);
hosts.forEach(h => { h.r = rScale(h.alerts); });

// ---- Region membership test (shared by seeding, density check, clamp) --
function satisfiesRegion(x, y, memberships, r, margin=1){
  for (const key of ['A','B','C']){
    const c = circles[key];
    const dx = x-c.x, dy = y-c.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const include = memberships.includes(key);
    if (include && dist > c.radius - r - margin) return false;
    if (!include && dist < c.radius + r + margin) return false;
  }
  return true;
}

// ---- Monte Carlo area estimate per region, so density never exceeds ----
// what a region can actually hold. Thin crescent regions (e.g. "A only"
// where A overlaps heavily with B and C) have real, limited area — if the
// requested dot count doesn't fit, dots must shrink rather than spill out.
const svgWidth = 420, svgHeight = 360;
function classify(x,y){
  const included = ['A','B','C'].filter(key => {
    const c = circles[key];
    const dx=x-c.x, dy=y-c.y;
    return Math.sqrt(dx*dx+dy*dy) <= c.radius;
  });
  return included.sort().join(',');
}
const SAMPLES = 40000;
const areaCounts = {};
for (let i=0;i<SAMPLES;i++){
  const x = Math.random()*svgWidth, y = Math.random()*svgHeight;
  const key = classify(x,y);
  if (!key) continue;
  areaCounts[key] = (areaCounts[key]||0)+1;
}
const boxArea = svgWidth*svgHeight;
const regionArea = {};
Object.keys(regionCounts).forEach(key => {
  const sortedKey = key.split(',').sort().join(',');
  regionArea[key] = ((areaCounts[sortedKey]||0)/SAMPLES) * boxArea;
});

const PACKING_EFFICIENCY = 0.82;
Object.keys(regionCounts).forEach(key => {
  const sortedKey = key.split(',').sort().join(',');
  const hostsInRegion = hosts.filter(h => h.memberships.slice().sort().join(',') === sortedKey);
  const requestedArea = d3.sum(hostsInRegion, h => Math.PI * h.r * h.r);
  const capacity = regionArea[key] * PACKING_EFFICIENCY;
  if (requestedArea > capacity){
    const scale = Math.sqrt(capacity / requestedArea);
    hostsInRegion.forEach(h => { h.r = Math.max(1.3, h.r * scale); });
  }
});

// ---- Rejection-sample a valid seed position per host --------------------
// Seeding inside the correct region from the start (rather than a jittered
// guess) means the simulation mostly just has to resolve collisions, not
// fight to migrate nodes across boundaries.
function bboxForIncluded(keys){
  let minX=-Infinity,maxX=Infinity,minY=-Infinity,maxY=Infinity;
  keys.forEach(k=>{
    const c=circles[k];
    minX=Math.max(minX,c.x-c.radius);
    maxX=Math.min(maxX,c.x+c.radius);
    minY=Math.max(minY,c.y-c.radius);
    maxY=Math.min(maxY,c.y+c.radius);
  });
  return {minX,maxX,minY,maxY};
}
function clampOnce(p, node){
  let { x, y } = p;
  for (const key of ['A','B','C']){
    const c = circles[key];
    const dx = x-c.x, dy = y-c.y;
    const dist = Math.sqrt(dx*dx+dy*dy) || 0.0001;
    const include = node.memberships.includes(key);
    if (include){
      const maxDist = c.radius - node.r - 1;
      if (dist > maxDist){ const s=maxDist/dist; x=c.x+dx*s; y=c.y+dy*s; }
    } else {
      const minDist = c.radius + node.r + 1;
      if (dist < minDist){ const s=minDist/dist; x=c.x+dx*s; y=c.y+dy*s; }
    }
  }
  return { x, y };
}
hosts.forEach(h => {
  const bb = bboxForIncluded(h.memberships);
  let found = false;
  for (let attempt=0; attempt<400; attempt++){
    const x = bb.minX + Math.random()*(bb.maxX-bb.minX);
    const y = bb.minY + Math.random()*(bb.maxY-bb.minY);
    if (satisfiesRegion(x,y,h.memberships,h.r)){ h.x=x; h.y=y; found=true; break; }
  }
  if (!found){
    let p = { x:(bb.minX+bb.maxX)/2, y:(bb.minY+bb.maxY)/2 };
    for (let i=0;i<40;i++) p = clampOnce(p, h);
    h.x = p.x; h.y = p.y;
  }
});

const svg = div.select('svg');
const dotLayer = svg.append('g').attr('class','dot-layer');

const dotSel = dotLayer.selectAll('circle.host-dot')
  .data(hosts)
  .join('circle')
  .attr('class','host-dot')
  .attr('r', d=>d.r)
  .attr('fill', d=>d.color)
  .attr('opacity', 0.9);

const tooltip = d3.select('body').append('div').attr('class','venntooltip').style('opacity',0);

dotSel
  .on('mouseover', function(event,d){
    tooltip.transition().duration(100).style('opacity',1);
    tooltip.html(`<b>${d.id}</b><br>${d.memberships.map(k=>NAMES[k]).join(' + ')}<br>${d.alerts} alerts`)
      .style('left', (event.pageX+12)+'px')
      .style('top', (event.pageY-24)+'px');
  })
  .on('mousemove', function(event){
    tooltip.style('left', (event.pageX+12)+'px').style('top', (event.pageY-24)+'px');
  })
  .on('mouseout', function(){
    tooltip.transition().duration(150).style('opacity',0);
  });

// ---- Hard containment clamp, iterated to convergence each tick ---------
// Checking A, then B, then C once each can fix one boundary at the expense
// of another (Gauss-Seidel-style correction). Running several passes per
// tick lets all three constraints settle together — verified numerically
// against this exact dataset to reach zero violations.
function clampToRegion(node){
  let p = { x: node.x, y: node.y };
  for (let i=0;i<6;i++) p = clampOnce(p, node);
  node.x = p.x; node.y = p.y;
}

const sim = d3.forceSimulation(hosts)
  .force('collide', d3.forceCollide(d=>d.r + 0.6).iterations(3))
  .alphaDecay(0.02)
  .on('tick', () => {
    hosts.forEach(clampToRegion);
    dotSel.attr('cx', d=>d.x).attr('cy', d=>d.y);
  });
</script>

</body>
</html>
